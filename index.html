    <script>
      // Pick the theme before first paint: saved choice, else the device setting
      (function () {
        var t;
        try { t = localStorage.getItem('iba_theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.setAttribute('data-theme', t);
      })();
